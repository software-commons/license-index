name: Domain

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -B -m unittest discover -s tests -v
  registry:
    name: Registry validation
    needs: [platform]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every platform test run
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: index
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: software-commons/.github
          path: policy
          ref: ab26f278422772f2d9e5d4dd016407d14372a710
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate schema, frozen history and active qualification
        working-directory: index
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -eu
          python -m pip install --disable-pip-version-check -r ../policy/tools/sces/requirements.txt
          python -B -m tools.schema_check
          args=()
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python -B -m tools.index validate --policy ../policy "${args[@]}"
